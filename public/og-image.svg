<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAF5"/>
      <stop offset="50%" stop-color="#FAF4E9"/>
      <stop offset="100%" stop-color="#F2E6D0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EEDC"/>
      <stop offset="40%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#9C6B25"/>
    </linearGradient>
    <radialGradient id="burgundyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A71D36"/>
      <stop offset="100%" stop-color="#7C1024"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7C1024" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Outer Double Gold Border -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.8"/>
  <rect x="46" y="46" width="1108" height="538" rx="12" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M56 90 C 56 65, 65 56, 90 56"/>
    <circle cx="56" cy="56" r="4" fill="url(#gold)"/>
    <!-- Top Right -->
    <path d="M1144 90 C 1144 65, 1135 56, 1110 56"/>
    <circle cx="1144" cy="56" r="4" fill="url(#gold)"/>
    <!-- Bottom Left -->
    <path d="M56 540 C 56 565, 65 574, 90 574"/>
    <circle cx="56" cy="574" r="4" fill="url(#gold)"/>
    <!-- Bottom Right -->
    <path d="M1144 540 C 1144 565, 1135 574, 1110 574"/>
    <circle cx="1144" cy="574" r="4" fill="url(#gold)"/>
  </g>

  <!-- Golden Christian Cross -->
  <g transform="translate(600, 105)" filter="url(#shadow)">
    <line x1="0" y1="-28" x2="0" y2="28" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="3.5" fill="url(#gold)"/>
    <circle cx="0" cy="-28" r="2" fill="url(#gold)"/>
    <circle cx="0" cy="28" r="2" fill="url(#gold)"/>
    <circle cx="-18" cy="-10" r="2" fill="url(#gold)"/>
    <circle cx="18" cy="-10" r="2" fill="url(#gold)"/>
  </g>

  <!-- Bible Verse -->
  <text x="600" y="165" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-style="italic" fill="#7C1024" text-anchor="middle" letter-spacing="1">
    "What therefore God has joined together, let no one separate."
  </text>
  <text x="600" y="190" font-family="'Cinzel', serif" font-size="13" font-weight="600" fill="#D7AB63" text-anchor="middle" letter-spacing="3">
    MATTHEW 19:6
  </text>

  <!-- Invitation Subtitle -->
  <text x="600" y="240" font-family="'Cinzel', serif" font-size="15" font-weight="600" fill="#59654C" text-anchor="middle" letter-spacing="4">
    TOGETHER WITH THEIR FAMILIES
  </text>

  <!-- Couple Names in Script & Serif -->
  <text x="600" y="325" font-family="'Alex Brush', cursive, serif" font-size="78" fill="#7C1024" text-anchor="middle">
    Sheba &amp; Kenneth
  </text>

  <!-- Gold Divider -->
  <g transform="translate(600, 365)" stroke="url(#gold)" stroke-width="1.5">
    <line x1="-160" y1="0" x2="-25" y2="0"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#D7AB63"/>
    <line x1="25" y1="0" x2="160" y2="0"/>
  </g>

  <!-- Celebration Subhead -->
  <text x="600" y="415" font-family="'Cinzel', serif" font-size="22" font-weight="600" fill="#2B2625" text-anchor="middle" letter-spacing="3">
    A CELEBRATION OF LOVE
  </text>
  
  <text x="600" y="445" font-family="'Cormorant Garamond', serif" font-size="18" fill="#5C5251" text-anchor="middle" letter-spacing="2">
    ENGAGEMENT &amp; HOLY MATRIMONY
  </text>

  <!-- Date & Venue pill -->
  <g transform="translate(600, 500)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#7C1024" opacity="0.95"/>
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="15" font-weight="600" fill="#FAF4E9" text-anchor="middle" letter-spacing="2">
      JANUARY 2 &amp; 11, 2027 • KERALA, INDIA
    </text>
  </g>

  <!-- Footer Watermark -->
  <text x="600" y="565" font-family="'Cinzel', serif" font-size="11" fill="#A6772E" text-anchor="middle" letter-spacing="3">
    OFFICIAL DIGITAL INVITATION
  </text>
</svg>
