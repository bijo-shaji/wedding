<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Warm Champagne & Silk Radiant Gradient -->
    <radialGradient id="silkRadiance" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="35%" stop-color="#FAF2E4"/>
      <stop offset="70%" stop-color="#F3E5D0"/>
      <stop offset="100%" stop-color="#E7D2B5"/>
    </radialGradient>

    <!-- Deep Royal Burgundy Rose Gradient -->
    <radialGradient id="bgRoseBurgundy" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A71D36"/>
      <stop offset="60%" stop-color="#7C1024"/>
      <stop offset="100%" stop-color="#4A0512"/>
    </radialGradient>

    <!-- Blush Pink Blossom Gradient -->
    <radialGradient id="bgPetalBlush" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3F1"/>
      <stop offset="65%" stop-color="#EAC0BD"/>
      <stop offset="100%" stop-color="#DCA4A0"/>
    </radialGradient>

    <!-- Sage Foliage Gradient -->
    <linearGradient id="bgLeafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9E82"/>
      <stop offset="70%" stop-color="#59654C"/>
      <stop offset="100%" stop-color="#3B4432"/>
    </linearGradient>

    <!-- Metallic Gold Foliage & Accents -->
    <linearGradient id="bgGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="35%" stop-color="#EED9B2"/>
      <stop offset="70%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#9C6B25"/>
    </linearGradient>

    <!-- Ambient Golden Bokeh Light Sphere -->
    <radialGradient id="bokehGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5DB" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#E5B458" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 1. Luxurious Base Champagne Silk Background -->
  <rect width="1920" height="1080" fill="url(#silkRadiance)"/>

  <!-- 2. Golden Arch Rings in the Background (Matching Pinterest Artwork) -->
  <g opacity="0.32" transform="translate(960, 420)">
    <circle cx="0" cy="0" r="480" fill="none" stroke="url(#bgGoldFoil)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="496" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1" stroke-dasharray="8,6"/>
    <circle cx="0" cy="0" r="560" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 3. Soft Ambient Golden Bokeh Particles -->
  <g opacity="0.75">
    <circle cx="280" cy="180" r="90" fill="url(#bokehGlow)"/>
    <circle cx="1640" cy="220" r="110" fill="url(#bokehGlow)"/>
    <circle cx="480" cy="520" r="130" fill="url(#bokehGlow)"/>
    <circle cx="1440" cy="580" r="140" fill="url(#bokehGlow)"/>
    <circle cx="960" cy="240" r="160" fill="url(#bokehGlow)"/>
    <circle cx="200" cy="850" r="120" fill="url(#bokehGlow)"/>
    <circle cx="1720" cy="860" r="130" fill="url(#bokehGlow)"/>
    <circle cx="820" cy="920" r="100" fill="url(#bokehGlow)"/>
    <circle cx="1120" cy="940" r="110" fill="url(#bokehGlow)"/>
  </g>

  <!-- 4. TOP LEFT FLORAL CANOPY ARRANGEMENT -->
  <g transform="translate(0, 0)">
    <!-- Golden Tendrils -->
    <path d="M -20 -20 Q 200 60, 360 240 Q 420 320, 480 500" fill="none" stroke="url(#bgGoldFoil)" stroke-width="2" opacity="0.75"/>
    <path d="M -20 -20 Q 80 180, 240 380 Q 300 460, 320 620" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8" opacity="0.65"/>

    <!-- Sage Eucalyptus Leaves -->
    <path d="M 120 40 Q 180 30, 190 70 Q 160 110, 120 80 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 220 80 Q 280 60, 300 110 Q 270 140, 210 120 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 160 160 Q 230 150, 240 210 Q 200 240, 150 200 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 280 200 Q 360 190, 370 260 Q 310 290, 260 240 Z" fill="url(#bgLeafSage)" opacity="0.8"/>
    <path d="M 210 290 Q 280 300, 270 370 Q 210 370, 190 320 Z" fill="url(#bgLeafSage)" opacity="0.8"/>

    <!-- Golden Leaves -->
    <path d="M 80 120 Q 140 130, 130 170 Q 90 180, 70 140 Z" fill="url(#bgGoldFoil)" opacity="0.9"/>
    <path d="M 320 140 Q 380 160, 360 210 Q 310 200, 300 160 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 240 380 Q 310 400, 290 460 Q 230 450, 220 400 Z" fill="url(#bgGoldFoil)" opacity="0.8"/>

    <!-- Blush Peonies -->
    <circle cx="160" cy="110" r="54" fill="url(#bgPetalBlush)" opacity="0.95"/>
    <circle cx="270" cy="160" r="46" fill="url(#bgPetalBlush)" opacity="0.9"/>
    <circle cx="180" cy="260" r="44" fill="url(#bgPetalBlush)" opacity="0.9"/>
    <circle cx="340" cy="270" r="40" fill="url(#bgPetalBlush)" opacity="0.85"/>

    <!-- Deep Burgundy English Roses -->
    <circle cx="110" cy="70" r="42" fill="url(#bgRoseBurgundy)"/>
    <circle cx="210" cy="180" r="48" fill="url(#bgRoseBurgundy)"/>
    <circle cx="120" cy="200" r="38" fill="url(#bgRoseBurgundy)"/>
    <circle cx="280" cy="310" r="36" fill="url(#bgRoseBurgundy)"/>

    <!-- Golden Berry Clusters (Baby's breath / Stamen) -->
    <circle cx="70" cy="160" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="85" cy="175" r="3.5" fill="url(#bgGoldFoil)"/>
    <circle cx="150" cy="220" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="240" cy="240" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="330" cy="220" r="4.5" fill="url(#bgGoldFoil)"/>
    <circle cx="380" cy="330" r="4" fill="url(#bgGoldFoil)"/>
  </g>

  <!-- 5. TOP RIGHT FLORAL CANOPY ARRANGEMENT (Mirrored) -->
  <g transform="translate(1920, 0) scale(-1, 1)">
    <!-- Golden Tendrils -->
    <path d="M -20 -20 Q 200 60, 360 240 Q 420 320, 480 500" fill="none" stroke="url(#bgGoldFoil)" stroke-width="2" opacity="0.75"/>
    <path d="M -20 -20 Q 80 180, 240 380 Q 300 460, 320 620" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8" opacity="0.65"/>

    <!-- Sage Eucalyptus Leaves -->
    <path d="M 120 40 Q 180 30, 190 70 Q 160 110, 120 80 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 220 80 Q 280 60, 300 110 Q 270 140, 210 120 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 160 160 Q 230 150, 240 210 Q 200 240, 150 200 Z" fill="url(#bgLeafSage)" opacity="0.85"/>
    <path d="M 280 200 Q 360 190, 370 260 Q 310 290, 260 240 Z" fill="url(#bgLeafSage)" opacity="0.8"/>
    <path d="M 210 290 Q 280 300, 270 370 Q 210 370, 190 320 Z" fill="url(#bgLeafSage)" opacity="0.8"/>

    <!-- Golden Leaves -->
    <path d="M 80 120 Q 140 130, 130 170 Q 90 180, 70 140 Z" fill="url(#bgGoldFoil)" opacity="0.9"/>
    <path d="M 320 140 Q 380 160, 360 210 Q 310 200, 300 160 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 240 380 Q 310 400, 290 460 Q 230 450, 220 400 Z" fill="url(#bgGoldFoil)" opacity="0.8"/>

    <!-- Blush Peonies -->
    <circle cx="160" cy="110" r="54" fill="url(#bgPetalBlush)" opacity="0.95"/>
    <circle cx="270" cy="160" r="46" fill="url(#bgPetalBlush)" opacity="0.9"/>
    <circle cx="180" cy="260" r="44" fill="url(#bgPetalBlush)" opacity="0.9"/>
    <circle cx="340" cy="270" r="40" fill="url(#bgPetalBlush)" opacity="0.85"/>

    <!-- Deep Burgundy English Roses -->
    <circle cx="110" cy="70" r="42" fill="url(#bgRoseBurgundy)"/>
    <circle cx="210" cy="180" r="48" fill="url(#bgRoseBurgundy)"/>
    <circle cx="120" cy="200" r="38" fill="url(#bgRoseBurgundy)"/>
    <circle cx="280" cy="310" r="36" fill="url(#bgRoseBurgundy)"/>

    <!-- Golden Berry Clusters -->
    <circle cx="70" cy="160" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="85" cy="175" r="3.5" fill="url(#bgGoldFoil)"/>
    <circle cx="150" cy="220" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="240" cy="240" r="4" fill="url(#bgGoldFoil)"/>
    <circle cx="330" cy="220" r="4.5" fill="url(#bgGoldFoil)"/>
    <circle cx="380" cy="330" r="4" fill="url(#bgGoldFoil)"/>
  </g>

  <!-- 6. BOTTOM CORNER FLORAL ACCENTS -->
  <g transform="translate(0, 1080) scale(1, -1)">
    <path d="M -20 -20 Q 160 50, 280 200 Q 320 260, 360 380" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8" opacity="0.6"/>
    <circle cx="120" cy="90" r="38" fill="url(#bgRoseBurgundy)" opacity="0.85"/>
    <circle cx="180" cy="140" r="36" fill="url(#bgPetalBlush)" opacity="0.85"/>
    <path d="M 190 70 Q 240 60, 250 100 Q 220 130, 180 110 Z" fill="url(#bgLeafSage)" opacity="0.8"/>
  </g>

  <g transform="translate(1920, 1080) scale(-1, -1)">
    <path d="M -20 -20 Q 160 50, 280 200 Q 320 260, 360 380" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8" opacity="0.6"/>
    <circle cx="120" cy="90" r="38" fill="url(#bgRoseBurgundy)" opacity="0.85"/>
    <circle cx="180" cy="140" r="36" fill="url(#bgPetalBlush)" opacity="0.85"/>
    <path d="M 190 70 Q 240 60, 250 100 Q 220 130, 180 110 Z" fill="url(#bgLeafSage)" opacity="0.8"/>
  </g>
</svg>
