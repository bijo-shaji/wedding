<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Radiant Warm Champagne Silk Gradient -->
    <radialGradient id="silkRadiance" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="35%" stop-color="#FAF3E6"/>
      <stop offset="70%" stop-color="#F2E5D2"/>
      <stop offset="100%" stop-color="#E8D5BC"/>
    </radialGradient>

    <!-- Deep Royal Burgundy Rose Gradient -->
    <radialGradient id="bgRoseBurgundy" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A71D36"/>
      <stop offset="60%" stop-color="#7C1024"/>
      <stop offset="100%" stop-color="#4A0512"/>
    </radialGradient>

    <!-- Soft Blush Peony Gradient -->
    <radialGradient id="bgPetalBlush" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5F3"/>
      <stop offset="65%" stop-color="#EAC0BD"/>
      <stop offset="100%" stop-color="#D89A96"/>
    </radialGradient>

    <!-- Sage Eucalyptus Foliage Gradient -->
    <linearGradient id="bgLeafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9E82"/>
      <stop offset="70%" stop-color="#59654C"/>
      <stop offset="100%" stop-color="#384230"/>
    </linearGradient>

    <!-- Luxury Gold Foil & Filigree -->
    <linearGradient id="bgGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="35%" stop-color="#EED9B2"/>
      <stop offset="70%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#9C6B25"/>
    </linearGradient>

    <!-- Ambient Golden Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E5B458" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Base Champagne Silk Luxury Canvas -->
  <rect width="1920" height="1080" fill="url(#silkRadiance)"/>

  <!-- 2. Concentric Golden Arch Lines (From Physical Invitation) -->
  <g opacity="0.25" transform="translate(960, 480)">
    <circle cx="0" cy="0" r="460" fill="none" stroke="url(#bgGoldFoil)" stroke-width="2"/>
    <circle cx="0" cy="0" r="476" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1" stroke-dasharray="8,6"/>
    <circle cx="0" cy="0" r="540" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="620" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1" stroke-dasharray="12,8" opacity="0.4"/>
  </g>

  <!-- 3. Soft Ambient Golden Light Halos -->
  <g opacity="0.6">
    <circle cx="320" cy="220" r="160" fill="url(#ambientGlow)"/>
    <circle cx="1600" cy="260" r="180" fill="url(#ambientGlow)"/>
    <circle cx="540" cy="620" r="200" fill="url(#ambientGlow)"/>
    <circle cx="1380" cy="680" r="220" fill="url(#ambientGlow)"/>
    <circle cx="960" cy="300" r="240" fill="url(#ambientGlow)"/>
  </g>

  <!-- 4. TOP-LEFT BOTANICAL FLORAL BRANCH (Delicate organic leaves & roses, no balloons) -->
  <g transform="translate(0, 0)" opacity="0.85">
    <!-- Golden Swirling Vine -->
    <path d="M 0 40 Q 120 70, 180 180 T 260 360" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8"/>
    <path d="M 40 0 Q 70 120, 180 200 T 360 260" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.5" opacity="0.7"/>

    <!-- Sage Eucalyptus Leaves -->
    <path d="M 60 70 Q 110 50, 130 90 Q 90 120, 60 70 Z" fill="url(#bgLeafSage)"/>
    <path d="M 120 120 Q 170 100, 180 150 Q 140 180, 120 120 Z" fill="url(#bgLeafSage)"/>
    <path d="M 90 180 Q 140 170, 150 220 Q 100 240, 90 180 Z" fill="url(#bgLeafSage)"/>
    <path d="M 170 210 Q 230 190, 240 250 Q 180 280, 170 210 Z" fill="url(#bgLeafSage)"/>
    <path d="M 140 290 Q 200 280, 200 340 Q 150 360, 140 290 Z" fill="url(#bgLeafSage)"/>

    <!-- Golden Accent Leaves -->
    <path d="M 100 40 Q 140 30, 150 70 Q 110 90, 100 40 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 190 140 Q 240 130, 240 180 Q 190 200, 190 140 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 230 250 Q 280 240, 280 290 Q 230 310, 230 250 Z" fill="url(#bgGoldFoil)" opacity="0.8"/>

    <!-- Layered Botanical Rose 1 (Top Left) -->
    <g transform="translate(100, 110)">
      <path d="M -30 -10 C -40 -35, 10 -45, 25 -25 C 45 -5, 30 35, 0 35 C -25 35, -45 10, -30 -10 Z" fill="url(#bgRoseBurgundy)"/>
      <path d="M -15 -10 C -25 -25, 10 -30, 15 -15 C 25 0, 15 20, 0 20 C -15 20, -25 5, -15 -10 Z" fill="#91142C"/>
      <circle cx="0" cy="0" r="7" fill="url(#bgGoldFoil)"/>
    </g>

    <!-- Layered Botanical Peony 2 (Blush Pink) -->
    <g transform="translate(190, 170)">
      <path d="M -35 -15 C -45 -40, 15 -50, 35 -25 C 50 0, 35 40, 0 40 C -30 40, -50 15, -35 -15 Z" fill="url(#bgPetalBlush)"/>
      <path d="M -20 -10 C -25 -25, 10 -30, 20 -15 C 25 5, 15 25, 0 25 C -15 25, -25 5, -20 -10 Z" fill="#F4D3D0"/>
      <circle cx="0" cy="0" r="5" fill="url(#bgGoldFoil)"/>
    </g>

    <!-- Small Burgundy Bud -->
    <g transform="translate(150, 260)">
      <path d="M -18 -8 C -25 -20, 10 -25, 18 -12 C 25 0, 15 18, 0 18 C -15 18, -25 5, -18 -8 Z" fill="url(#bgRoseBurgundy)"/>
    </g>
  </g>

  <!-- 5. TOP-RIGHT BOTANICAL FLORAL BRANCH (Mirrored gracefully) -->
  <g transform="translate(1920, 0) scale(-1, 1)" opacity="0.85">
    <!-- Golden Swirling Vine -->
    <path d="M 0 40 Q 120 70, 180 180 T 260 360" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.8"/>
    <path d="M 40 0 Q 70 120, 180 200 T 360 260" fill="none" stroke="url(#bgGoldFoil)" stroke-width="1.5" opacity="0.7"/>

    <!-- Sage Eucalyptus Leaves -->
    <path d="M 60 70 Q 110 50, 130 90 Q 90 120, 60 70 Z" fill="url(#bgLeafSage)"/>
    <path d="M 120 120 Q 170 100, 180 150 Q 140 180, 120 120 Z" fill="url(#bgLeafSage)"/>
    <path d="M 90 180 Q 140 170, 150 220 Q 100 240, 90 180 Z" fill="url(#bgLeafSage)"/>
    <path d="M 170 210 Q 230 190, 240 250 Q 180 280, 170 210 Z" fill="url(#bgLeafSage)"/>
    <path d="M 140 290 Q 200 280, 200 340 Q 150 360, 140 290 Z" fill="url(#bgLeafSage)"/>

    <!-- Golden Accent Leaves -->
    <path d="M 100 40 Q 140 30, 150 70 Q 110 90, 100 40 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 190 140 Q 240 130, 240 180 Q 190 200, 190 140 Z" fill="url(#bgGoldFoil)" opacity="0.85"/>
    <path d="M 230 250 Q 280 240, 280 290 Q 230 310, 230 250 Z" fill="url(#bgGoldFoil)" opacity="0.8"/>

    <!-- Layered Botanical Rose -->
    <g transform="translate(100, 110)">
      <path d="M -30 -10 C -40 -35, 10 -45, 25 -25 C 45 -5, 30 35, 0 35 C -25 35, -45 10, -30 -10 Z" fill="url(#bgRoseBurgundy)"/>
      <path d="M -15 -10 C -25 -25, 10 -30, 15 -15 C 25 0, 15 20, 0 20 C -15 20, -25 5, -15 -10 Z" fill="#91142C"/>
      <circle cx="0" cy="0" r="7" fill="url(#bgGoldFoil)"/>
    </g>

    <!-- Layered Botanical Peony (Blush Pink) -->
    <g transform="translate(190, 170)">
      <path d="M -35 -15 C -45 -40, 15 -50, 35 -25 C 50 0, 35 40, 0 40 C -30 40, -50 15, -35 -15 Z" fill="url(#bgPetalBlush)"/>
      <path d="M -20 -10 C -25 -25, 10 -30, 20 -15 C 25 5, 15 25, 0 25 C -15 25, -25 5, -20 -10 Z" fill="#F4D3D0"/>
      <circle cx="0" cy="0" r="5" fill="url(#bgGoldFoil)"/>
    </g>

    <!-- Small Burgundy Bud -->
    <g transform="translate(150, 260)">
      <path d="M -18 -8 C -25 -20, 10 -25, 18 -12 C 25 0, 15 18, 0 18 C -15 18, -25 5, -18 -8 Z" fill="url(#bgRoseBurgundy)"/>
    </g>
  </g>
</svg>