<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Luxurious Stage Lighting -->
    <radialGradient id="stageSpotlight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FBF2DF" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#EEDAC0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DFC5A0" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Deep Royal Burgundy Rose -->
    <radialGradient id="engRoseBurgundy" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C52243"/>
      <stop offset="50%" stop-color="#801026"/>
      <stop offset="100%" stop-color="#4A0512"/>
    </radialGradient>

    <!-- Soft Blush Peony -->
    <radialGradient id="engPetalBlush" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF3F1"/>
      <stop offset="60%" stop-color="#EAC0BD"/>
      <stop offset="100%" stop-color="#D58696"/>
    </radialGradient>

    <!-- Luxury Gold Ribbon & Arch -->
    <linearGradient id="engGoldArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="30%" stop-color="#ECC480"/>
      <stop offset="65%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#9C6B25"/>
    </linearGradient>

    <linearGradient id="engLeafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E9E82"/>
      <stop offset="60%" stop-color="#59654C"/>
      <stop offset="100%" stop-color="#343D2C"/>
    </linearGradient>

    <radialGradient id="engChandelierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#E5B458" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Grand Stage Warm Champagne Background -->
  <rect width="1200" height="900" fill="url(#stageSpotlight)"/>

  <!-- 2. Opulent Silk Drapery Valance (Stage Curtains) -->
  <path d="M 0 0 L 1200 0 L 1200 120 Q 900 80, 600 120 Q 300 80, 0 120 Z" fill="#F4E3CB" opacity="0.45"/>
  <path d="M 0 0 Q 180 200, 0 450" fill="none" stroke="#D7AB63" stroke-width="2" opacity="0.25"/>
  <path d="M 1200 0 Q 1020 200, 1200 450" fill="none" stroke="#D7AB63" stroke-width="2" opacity="0.25"/>

  <!-- 3. Twin Grand Crystal Chandeliers Hanging from Ceiling -->
  <g transform="translate(180, 30)" opacity="0.6">
    <line x1="0" y1="0" x2="0" y2="70" stroke="url(#engGoldArch)" stroke-width="2.5"/>
    <ellipse cx="0" cy="70" rx="45" ry="12" fill="none" stroke="url(#engGoldArch)" stroke-width="2"/>
    <path d="M -45 70 Q 0 140, 45 70" fill="none" stroke="url(#engGoldArch)" stroke-width="2"/>
    <circle cx="0" cy="148" r="7" fill="#ECC480"/>
    <circle cx="0" cy="95" r="50" fill="url(#engChandelierGlow)"/>
  </g>

  <g transform="translate(1020, 30)" opacity="0.6">
    <line x1="0" y1="0" x2="0" y2="70" stroke="url(#engGoldArch)" stroke-width="2.5"/>
    <ellipse cx="0" cy="70" rx="45" ry="12" fill="none" stroke="url(#engGoldArch)" stroke-width="2"/>
    <path d="M -45 70 Q 0 140, 45 70" fill="none" stroke="url(#engGoldArch)" stroke-width="2"/>
    <circle cx="0" cy="148" r="7" fill="#ECC480"/>
    <circle cx="0" cy="95" r="50" fill="url(#engChandelierGlow)"/>
  </g>

  <!-- 4. Grand Golden Circular Engagement Arch Centerpiece -->
  <g transform="translate(600, 480)" opacity="0.45">
    <circle cx="0" cy="0" r="320" fill="none" stroke="url(#engGoldArch)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="332" fill="none" stroke="url(#engGoldArch)" stroke-width="1.2" stroke-dasharray="8,6"/>
  </g>

  <!-- 5. Floral Garland Swags at Side Corners (Leaving Center Text Completely Unobstructed) -->
  <g transform="translate(300, 260)" opacity="0.8">
    <path d="M -40 -20 Q 0 -50, 40 -10 Q 10 30, -40 -20 Z" fill="url(#engLeafSage)"/>
    <path d="M 0 -15 C -20 -30, 20 -35, 25 -15 C 30 5, 10 20, 0 15 Z" fill="url(#engRoseBurgundy)"/>
    <circle cx="15" cy="10" r="14" fill="url(#engPetalBlush)"/>
  </g>

  <g transform="translate(900, 260) scale(-1, 1)" opacity="0.8">
    <path d="M -40 -20 Q 0 -50, 40 -10 Q 10 30, -40 -20 Z" fill="url(#engLeafSage)"/>
    <path d="M 0 -15 C -20 -30, 20 -35, 25 -15 C 30 5, 10 20, 0 15 Z" fill="url(#engRoseBurgundy)"/>
    <circle cx="15" cy="10" r="14" fill="url(#engPetalBlush)"/>
  </g>

  <!-- 6. Ambient Golden Light Halos -->
  <g opacity="0.5">
    <circle cx="180" cy="260" r="60" fill="url(#engChandelierGlow)"/>
    <circle cx="1020" cy="260" r="60" fill="url(#engChandelierGlow)"/>
    <circle cx="600" cy="650" r="140" fill="url(#engChandelierGlow)"/>
  </g>
</svg>