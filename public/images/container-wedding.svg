<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sacred Cathedral Sanctuary Glow -->
    <radialGradient id="cathedralAltarGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FBF2DE" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#EEDAC0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DFC49E" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Stained Glass Rosette Radiance -->
    <radialGradient id="stainedGlassBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#EAC0BD" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#801026" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#801026" stop-opacity="0"/>
    </radialGradient>

    <!-- Cathedral Gold Leaf & Arches -->
    <linearGradient id="cathedralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="35%" stop-color="#ECC480"/>
      <stop offset="70%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#8A5B18"/>
    </linearGradient>

    <!-- Candle Flame Glow -->
    <radialGradient id="candleFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE87C"/>
      <stop offset="70%" stop-color="#FFA834"/>
      <stop offset="100%" stop-color="#FF5E36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Reverent Cathedral Sanctuary Lighting Base -->
  <rect width="1200" height="900" fill="url(#cathedralAltarGlow)"/>

  <!-- 2. Sacred Rose Window (Rose Mandala) at the High Altar Top -->
  <g transform="translate(600, 150)">
    <circle cx="0" cy="0" r="140" fill="url(#stainedGlassBeam)"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#cathedralGold)" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#cathedralGold)" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#cathedralGold)" stroke-width="2" opacity="0.8"/>

    <!-- Gothic Tracery Cross Rays -->
    <g stroke="url(#cathedralGold)" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-115" x2="0" y2="115"/>
      <line x1="-115" y1="0" x2="115" y2="0"/>
      <line x1="-81" y1="-81" x2="81" y2="81"/>
      <line x1="-81" y1="81" x2="81" y2="-81"/>
    </g>

    <!-- Golden Altar Cross Silhouetted in Rose Window -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="-32" x2="0" y2="32" stroke="url(#cathedralGold)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-18" y1="-10" x2="18" y2="-10" stroke="url(#cathedralGold)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-10" r="3" fill="#FFF5DB"/>
    </g>
  </g>

  <!-- 3. Soaring Cathedral Gothic Vaulted Arches Architecture -->
  {/* Main Central Altar Sanctuary Arch */}
  <path
    d="M 240 900 L 240 400 C 240 220, 500 70, 600 50 C 700 70, 960 220, 960 400 L 960 900"
    fill="none"
    stroke="url(#cathedralGold)"
    stroke-width="3.5"
    opacity="0.6"
  />

  {/* Second Tier Inner Arch */}
  <path
    d="M 310 900 L 310 420 C 310 260, 510 130, 600 110 C 690 130, 890 260, 890 420 L 890 900"
    fill="none"
    stroke="url(#cathedralGold)"
    stroke-width="2"
    opacity="0.45"
  />

  {/* Left Side Cathedral Nave Column & Arch */}
  <path
    d="M 60 900 L 60 460 C 60 300, 180 230, 240 200 C 300 230, 360 330, 360 460 L 360 900"
    fill="none"
    stroke="url(#cathedralGold)"
    stroke-width="2"
    opacity="0.4"
  />

  {/* Right Side Cathedral Nave Column & Arch */}
  <path
    d="M 840 900 L 840 460 C 840 330, 900 230, 960 200 C 1020 230, 1140 300, 1140 460 L 1140 900"
    fill="none"
    stroke="url(#cathedralGold)"
    stroke-width="2"
    opacity="0.4"
  />

  <!-- 4. Sacred Altar Candle Candelabras with Glowing Flames -->
  {/* Left Altar Candelabra */}
  <g transform="translate(180, 580)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#cathedralGold)" stroke-width="3"/>
    <line x1="-35" y1="40" x2="35" y2="40" stroke="url(#cathedralGold)" stroke-width="2"/>
    <line x1="-35" y1="40" x2="-35" y2="0" stroke="#FFF5DB" stroke-width="5"/>
    <line x1="0" y1="20" x2="0" y2="-20" stroke="#FFF5DB" stroke-width="6"/>
    <line x1="35" y1="40" x2="35" y2="0" stroke="#FFF5DB" stroke-width="5"/>
    {/* Candle flames */}
    <circle cx="-35" cy="-8" r="14" fill="url(#candleFlame)"/>
    <circle cx="0" cy="-28" r="18" fill="url(#candleFlame)"/>
    <circle cx="35" cy="-8" r="14" fill="url(#candleFlame)"/>
  </g>

  {/* Right Altar Candelabra */}
  <g transform="translate(1020, 580)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#cathedralGold)" stroke-width="3"/>
    <line x1="-35" y1="40" x2="35" y2="40" stroke="url(#cathedralGold)" stroke-width="2"/>
    <line x1="-35" y1="40" x2="-35" y2="0" stroke="#FFF5DB" stroke-width="5"/>
    <line x1="0" y1="20" x2="0" y2="-20" stroke="#FFF5DB" stroke-width="6"/>
    <line x1="35" y1="40" x2="35" y2="0" stroke="#FFF5DB" stroke-width="5"/>
    {/* Candle flames */}
    <circle cx="-35" cy="-8" r="14" fill="url(#candleFlame)"/>
    <circle cx="0" cy="-28" r="18" fill="url(#candleFlame)"/>
    <circle cx="35" cy="-8" r="14" fill="url(#candleFlame)"/>
  </g>

  <!-- 5. Royal Burgundy Wedding Aisle Runner Perspective on Altar Floor -->
  <polygon points="510,900 690,900 640,650 560,650" fill="#7C1024" opacity="0.35"/>
  <polygon points="530,900 670,900 630,650 570,650" fill="#801026" opacity="0.3"/>
</svg>
