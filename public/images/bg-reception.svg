<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="recpGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFDF6" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FAF1E0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#EEDAC0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DFC8A6" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="lightBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E5B458" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stringLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7AB63" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ECC480" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base festive atmosphere -->
  <rect width="1600" height="900" fill="url(#recpGlow)"/>

  <!-- Festoon Fairy Lights Strings hanging across top -->
  <path d="M 0 40 Q 400 160, 800 50 Q 1200 160, 1600 40" fill="none" stroke="url(#stringLine)" stroke-width="1.8"/>
  <path d="M 0 100 Q 400 240, 800 110 Q 1200 240, 1600 100" fill="none" stroke="url(#stringLine)" stroke-width="1.5"/>

  <!-- Fairy Light Bulbs on String 1 -->
  <g fill="#FFFDE8">
    <circle cx="100" cy="70" r="5" opacity="0.8"/>
    <circle cx="200" cy="105" r="5.5" opacity="0.9"/>
    <circle cx="300" cy="130" r="6" opacity="0.85"/>
    <circle cx="400" cy="140" r="7" opacity="0.95"/>
    <circle cx="500" cy="130" r="6" opacity="0.85"/>
    <circle cx="600" cy="105" r="5.5" opacity="0.9"/>
    <circle cx="700" cy="75" r="5" opacity="0.8"/>
    <circle cx="800" cy="50" r="5.5" opacity="0.9"/>
    <circle cx="900" cy="75" r="5" opacity="0.8"/>
    <circle cx="1000" cy="105" r="5.5" opacity="0.9"/>
    <circle cx="1100" cy="130" r="6" opacity="0.85"/>
    <circle cx="1200" cy="140" r="7" opacity="0.95"/>
    <circle cx="1300" cy="130" r="6" opacity="0.85"/>
    <circle cx="1400" cy="105" r="5.5" opacity="0.9"/>
    <circle cx="1500" cy="70" r="5" opacity="0.8"/>
  </g>

  <!-- Sparkling Golden Reception Bokeh -->
  <circle cx="180" cy="380" r="110" fill="url(#lightBokeh)"/>
  <circle cx="450" cy="520" r="140" fill="url(#lightBokeh)"/>
  <circle cx="800" cy="420" r="180" fill="url(#lightBokeh)"/>
  <circle cx="1150" cy="520" r="130" fill="url(#lightBokeh)"/>
  <circle cx="1420" cy="380" r="120" fill="url(#lightBokeh)"/>
  <circle cx="680" cy="680" r="150" fill="url(#lightBokeh)"/>
  <circle cx="980" cy="710" r="140" fill="url(#lightBokeh)"/>
</svg>
