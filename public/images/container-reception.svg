<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Evening Banquet Lighting -->
    <radialGradient id="recpBallroomGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FAF1DE" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#EEDAC0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DFC49E" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Festoon Light Glow -->
    <radialGradient id="fairyBulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE885"/>
      <stop offset="70%" stop-color="#E5B458" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D7AB63" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="recpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="40%" stop-color="#ECC480"/>
      <stop offset="80%" stop-color="#D7AB63"/>
      <stop offset="100%" stop-color="#9C6B25"/>
    </linearGradient>
  </defs>

  <!-- 1. Warm Evening Ballroom Background -->
  <rect width="1200" height="900" fill="url(#recpBallroomGlow)"/>

  <!-- 2. Festoon Fairy Lights Strings Drapery from Ceiling -->
  <path d="M 0 30 Q 300 130, 600 40 Q 900 130, 1200 30" fill="none" stroke="url(#recpGold)" stroke-width="2" opacity="0.65"/>
  <path d="M 0 80 Q 300 200, 600 90 Q 900 200, 1200 80" fill="none" stroke="url(#recpGold)" stroke-width="1.8" opacity="0.55"/>
  <path d="M 0 140 Q 300 280, 600 150 Q 900 280, 1200 140" fill="none" stroke="url(#recpGold)" stroke-width="1.5" opacity="0.45"/>

  <!-- Fairy Light Glowing Bulbs on String 1 -->
  <g>
    <circle cx="80" cy="55" r="14" fill="url(#fairyBulbGlow)"/>
    <circle cx="160" cy="85" r="16" fill="url(#fairyBulbGlow)"/>
    <circle cx="240" cy="110" r="18" fill="url(#fairyBulbGlow)"/>
    <circle cx="320" cy="120" r="19" fill="url(#fairyBulbGlow)"/>
    <circle cx="400" cy="110" r="18" fill="url(#fairyBulbGlow)"/>
    <circle cx="480" cy="85" r="16" fill="url(#fairyBulbGlow)"/>
    <circle cx="560" cy="55" r="14" fill="url(#fairyBulbGlow)"/>
    <circle cx="640" cy="55" r="14" fill="url(#fairyBulbGlow)"/>
    <circle cx="720" cy="85" r="16" fill="url(#fairyBulbGlow)"/>
    <circle cx="800" cy="110" r="18" fill="url(#fairyBulbGlow)"/>
    <circle cx="880" cy="120" r="19" fill="url(#fairyBulbGlow)"/>
    <circle cx="960" cy="110" r="18" fill="url(#fairyBulbGlow)"/>
    <circle cx="1040" cy="85" r="16" fill="url(#fairyBulbGlow)"/>
    <circle cx="1120" cy="55" r="14" fill="url(#fairyBulbGlow)"/>
  </g>

  <!-- 3. Twin Grand Celebration Goblets Watermark Silhouette in Center -->
  <g transform="translate(600, 480)" opacity="0.18">
    <path d="M -40 -120 Q -30 -30, -20 20 L -20 120 L -60 140 L 0 140 L -10 120 L -10 20 Q 0 -30, 10 -120 Z" fill="url(#recpGold)"/>
    <path d="M 40 -120 Q 30 -30, 20 20 L 20 120 L 60 140 L 0 140 L 10 120 L 10 20 Q 0 -30, -10 -120 Z" fill="url(#recpGold)"/>
  </g>

  <!-- 4. Sparkling Celebration Golden Bokeh Circles -->
  <g opacity="0.65">
    <circle cx="160" cy="380" r="75" fill="url(#fairyBulbGlow)"/>
    <circle cx="1040" cy="380" r="85" fill="url(#fairyBulbGlow)"/>
    <circle cx="360" cy="520" r="95" fill="url(#fairyBulbGlow)"/>
    <circle cx="840" cy="520" r="90" fill="url(#fairyBulbGlow)"/>
    <circle cx="220" cy="720" r="110" fill="url(#fairyBulbGlow)"/>
    <circle cx="980" cy="720" r="115" fill="url(#fairyBulbGlow)"/>
    <circle cx="600" cy="740" r="120" fill="url(#fairyBulbGlow)"/>
  </g>
</svg>
