<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="cathedralGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FBF4E7" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#F0DFCA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DECCA8" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gothicArchGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#D7AB63" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C1024" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="roseWindowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#EAC0BD" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#7C1024" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C1024" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base reverent cathedral lighting -->
  <rect width="1600" height="900" fill="url(#cathedralGlow)"/>

  <!-- Rose Window Sacred Radial Mandala Halo in top center -->
  <g transform="translate(800, 160)">
    <circle cx="0" cy="0" r="160" fill="url(#roseWindowGlow)"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#gothicArchGold)" stroke-width="1.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#gothicArchGold)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#gothicArchGold)" stroke-width="1.5" opacity="0.7"/>

    <!-- Sacred Cathedral Petals / Tracery rays -->
    <g stroke="url(#gothicArchGold)" stroke-width="1" opacity="0.45">
      <line x1="0" y1="-130" x2="0" y2="130"/>
      <line x1="-130" y1="0" x2="130" y2="0"/>
      <line x1="-92" y1="-92" x2="92" y2="92"/>
      <line x1="-92" y1="92" x2="92" y2="-92"/>
    </g>
  </g>

  <!-- Soaring Cathedral Gothic Pointed Arches Architecture -->
  {/* Main Central Cathedral Vault Arch */}
  <path
    d="M 400 900 L 400 420 C 400 220, 680 80, 800 60 C 920 80, 1200 220, 1200 420 L 1200 900"
    fill="none"
    stroke="url(#gothicArchGold)"
    stroke-width="2.5"
    opacity="0.5"
  />
  {/* Inner Central Arch */}
  <path
    d="M 480 900 L 480 440 C 480 280, 700 150, 800 130 C 900 150, 1120 280, 1120 440 L 1120 900"
    fill="none"
    stroke="url(#gothicArchGold)"
    stroke-width="1.5"
    opacity="0.35"
  />

  {/* Left Aisle Gothic Arch */}
  <path
    d="M 60 900 L 60 500 C 60 340, 220 250, 320 220 C 420 250, 480 380, 480 500 L 480 900"
    fill="none"
    stroke="url(#gothicArchGold)"
    stroke-width="1.8"
    opacity="0.35"
  />

  {/* Right Aisle Gothic Arch */}
  <path
    d="M 1120 900 L 1120 500 C 1120 380, 1180 250, 1280 220 C 1380 250, 1540 340, 1540 500 L 1540 900"
    fill="none"
    stroke="url(#gothicArchGold)"
    stroke-width="1.8"
    opacity="0.35"
  />

  <!-- Soft Cathedral Candlelight Reflections -->
  <circle cx="340" cy="720" r="80" fill="#FFEAA7" opacity="0.35" filter="blur(20px)"/>
  <circle cx="1260" cy="720" r="80" fill="#FFEAA7" opacity="0.35" filter="blur(20px)"/>
  <circle cx="800" cy="780" r="100" fill="#FFEAA7" opacity="0.3" filter="blur(25px)"/>
</svg>
